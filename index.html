<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQ - Emergency</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="app">

    <!-- Primary MDRRMO Card -->
    <section class="card">
      <header class="card-header">
        <h1 class="agency-name">MDRRMO</h1>
        <p class="agency-sub">Municipal Disaster Risk Reduction & Management Office</p>
      </header>

      <div class="info-list">
        <div class="info-item">
          <span class="info-label">Hotlines</span>
          <p class="info-val" id="mdrrmoHotlines">-</p>
        </div>

        <div class="info-item">
          <span class="info-label">Location</span>
          <p class="info-val" id="mdrrmoLocation">Catarman</p>
        </div>
      </div>

      <!-- Emergency Call Button -->
      <a href="#" id="emergencyCallBtn" class="call-btn">
        EMERGENCY CALL
      </a>
    </section>

    <!-- 2-by-X Grid -->
    <section class="grid-section">
      <h2 class="grid-title">Emergency Response Units</h2>
      <div class="grid" id="unitsGrid">
        <div class="sk-card"></div>
        <div class="sk-card"></div>
        <div class="sk-card"></div>
        <div class="sk-card"></div>
      </div>
    </section>

    <!-- Ghost Button -->
    <a href="home.html" id="proceedHomeBtn" class="ghost-btn">
      Proceed to Home
    </a>

  </main>
</body>
</html>
