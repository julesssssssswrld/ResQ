      <!-- Weather & Time Companion Widget -->
      <aside class="card weather-card" id="weatherSection">

        </header>

        <div class="widget-block">
          <span class="block-label">Time & Date</span>
          <div class="time-row">

            <span class="widget-date" id="localDate">-</span>
          </div>
        </div>

        <div class="widget-block">
          <span class="block-label">Weather Status</span>
          <div class="weather-row">
            <div class="weather-temp-wrap">
              <span class="weather-temp" id="weatherTemp">-</span>
              <span class="weather-cond" id="weatherCondition">-</span>
            </div>
            <div class="weather-icon-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
              </svg>
            </div>
          </div>

    </section>

  <!-- Modular Injectable Directory Card Blueprint -->
  <template id="directoryCardTemplate">
    <a href="#" class="unit-card" data-component="unit-card">
      <div class="unit-card-header">
        <div class="unit-icon-chip" data-field="icon-wrap" aria-hidden="true">

          </svg>
        </div>

        </span>
      </div>
      <div>
        <h3 class="unit-name" data-field="name"></h3>
        <div class="unit-val-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span data-field="hotline"></span>
        </div>
      </div>
    </a>
  </template>

  <script>
    /* =====================================================================
       ResQ — home.html live weather widget (Open-Meteo, no API key)
       Attribution: "Weather data by Open-Meteo.com"
       ===================================================================== */

    const WMO = {
      0:'Clear Sky', 1:'Mainly Clear', 2:'Partly Cloudy', 3:'Overcast',
      45:'Foggy', 48:'Icy Fog',
      51:'Light Drizzle', 53:'Drizzle', 55:'Heavy Drizzle',
      56:'Light Freezing Drizzle', 57:'Freezing Drizzle',
      61:'Light Rain', 63:'Moderate Rain', 65:'Heavy Rain',
      66:'Light Freezing Rain', 67:'Freezing Rain',
      71:'Light Snow', 73:'Moderate Snow', 75:'Heavy Snow',
      77:'Snow Grains',
      80:'Light Rainshowers', 81:'Rainshowers', 82:'Violent Rainshowers',
      85:'Light Snow Showers', 86:'Heavy Snow Showers',
      95:'Thunderstorm', 96:'Thunderstorm w/ Hail', 99:'Thunderstorm w/ Heavy Hail'
    };

    async function loadWeather() {
      try {
        const url =
          'https://api.open-meteo.com/v1/forecast' +
          '?latitude=12.4974&longitude=124.6349' +
          '&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code' +
          '&wind_speed_unit=kmh&timezone=Asia%2FManila';

        const res  = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const c         = data.current;
        const tempC     = Math.round(c.temperature_2m);
        const humidity  = Math.round(c.relative_humidity_2m);
        const wind      = Math.round(c.wind_speed_10m);
        const precip    = c.precipitation.toFixed(1);
        const condition = WMO[c.weather_code] ?? 'Unknown';

        const el = id => document.getElementById(id);
        const set = (id, val) => { const e = el(id); if (e) e.textContent = val; };

        set('weatherTemp',      `${tempC}°C`);
        set('weatherCondition', condition);
        set('weatherDetails',   `Wind ${wind} km/h • Humidity ${humidity}% • Precip ${precip} mm`);
        set('weatherLocation',  'Catarman, Northern Samar');

      } catch (err) {
        console.warn('[ResQ] Weather fetch failed:', err.message);
      }
    }

    /* Local clock — updates every second */
    function tickClock() {
      const now  = new Date();
      const time = now.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      const date = now.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
      const tEl = document.getElementById('localTime');
      const dEl = document.getElementById('localDate');
      if (tEl) tEl.textContent = time;
      if (dEl) dEl.textContent = date;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadWeather();
      setInterval(loadWeather, 10 * 60 * 1000); // refresh every 10 min

      tickClock();
      setInterval(tickClock, 1000);
    });
  </script>
</body>
